<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابات أبو شهيرة | Abu Shuhaira Accounts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EEF2F6;--surface:#FFFFFF;--ink:#14213D;--muted:#5B6781;--line:#D3DBE6;--accent:#14213D;--on-accent:#FFFFFF;--amber:#FCA311;--red:#B83227;--green:#1B7F55;--tint:#FFF3DC;--hd:#14213D;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--surface:#18203A;--ink:#E9EEF8;--muted:#9AA7C2;--line:#2B3556;--accent:#FCA311;--on-accent:#14213D;--red:#FF8A7D;--green:#58D6A0;--tint:#3A2E12;--hd:#1B2748;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1424;--surface:#18203A;--ink:#E9EEF8;--muted:#9AA7C2;--line:#2B3556;--accent:#FCA311;--on-accent:#14213D;--red:#FF8A7D;--green:#58D6A0;--tint:#3A2E12;--hd:#1B2748;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Tajawal,"Segoe UI",Tahoma,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 16px 40px}
.hd{display:flex;align-items:center;gap:14px;background:var(--hd);color:#fff;border-radius:18px;padding:14px;margin-bottom:14px;border-bottom:4px solid var(--amber)}
.av{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--amber);flex:0 0 auto;background:#222}
.ht{flex:1;min-width:0}
h1{font-size:23px;line-height:1.25;font-weight:800;margin:0}
.en{direction:ltr;text-align:right;font-size:13px;letter-spacing:.06em;opacity:.8;margin:2px 0 6px}
.chip{display:inline-block;background:var(--amber);color:#14213D;font-weight:800;font-size:14px;border-radius:999px;padding:0 12px}
.snd{align-self:flex-start;min-height:34px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:10px;font:inherit;font-size:12px;padding:0 8px;cursor:pointer}
h2{font-size:17px;font-weight:700;margin:22px 0 8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.tab{min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--tint);border:1px solid var(--amber);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.total b{font-size:26px}
.okbox{background:var(--tint);border:1px solid var(--green);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:500}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
input,select,textarea{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;padding:10px 12px;direction:ltr;font-size:13px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font:inherit}
.btn{min-height:46px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;white-space:nowrap}
.btn.full{width:100%}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.grn{background:var(--green);color:#fff}
:root[data-theme="dark"] .btn.grn,:root:not([data-theme="light"]) .btn.grn{color:#0E1424}
.sm{color:var(--muted);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.bal{font-weight:800;font-size:20px;color:var(--red)}
.log{max-height:150px;overflow:auto;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin-bottom:10px;padding:4px 0}
.lg{display:grid;grid-template-columns:78px 1fr auto;gap:8px;font-size:14px;padding:2px 0}
.lg.p{color:var(--green)}
.badge{background:var(--red);color:#fff;border-radius:8px;padding:0 8px;font-size:13px;font-weight:700;margin-inline-start:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 label,.fl{font-size:13px;color:var(--muted);display:block}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-top:10px;font-size:14px;color:var(--muted)}
.calc b{color:var(--ink)}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tb>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.tb span{font-size:13px;color:var(--muted)}.tb b{font-size:19px}
.tb .pf{grid-column:1/-1;background:var(--tint);border-color:var(--green)}
.tb .pf b{color:var(--green);font-size:24px}
.msg{min-height:22px;margin:6px 0 0;font-size:14px;color:var(--muted)}
.msg.bad{color:var(--red)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
</style>
</head>

<script>
(function(){
var KEY="abushuhaira-v2",D={debts:[],items:[],freq:30,last:null,snd:true},tab="debts",note="";
function load(){try{var r=localStorage.getItem(KEY);if(r)D=Object.assign(D,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function esc(s){var p=document.createElement("p");p.textContent=s;return p.innerHTML}
function n(v){return Math.round((parseFloat(v)||0)*100)/100}
function f(v){return n(v).toLocaleString("en-US")}
function id(){return Date.now()+Math.floor(Math.random()*1000)}
function dt(t){var d=new Date(t);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()}
function find(a,v){return a.filter(function(x){return String(x.id)===String(v)})[0]}
var view=document.getElementById("view"),AC=null;

function tone(fr,t0,du,ty,vo){if(!D.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();var o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t0;o.type=ty;o.frequency.value=fr;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vo,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+du);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+du+.05)}catch(e){}}
var SND={
 add:function(){tone(659,0,.4,"sine",.2);tone(880,.11,.4,"sine",.2);tone(1319,.22,.7,"sine",.17)},
 debt:function(){tone(330,0,.14,"triangle",.28);tone(247,.09,.25,"triangle",.25)},
 pay:function(){[2093,2637,3136,4186].forEach(function(q,i){tone(q,i*.06,.35,"triangle",.12)});tone(1568,0,.12,"square",.05)},
 done:function(){[523,659,784,1047].forEach(function(q,i){tone(q,.35+i*.12,.5,"sine",.2)})}
};

function tot(){var t={cnt:D.items.length,q:0,cost:0,sale:0,debt:0};
 D.items.forEach(function(i){t.q+=i.qty;t.cost+=i.qty*i.cost;t.sale+=i.qty*i.price});
 D.debts.forEach(function(c){t.debt+=c.bal});t.profit=t.sale-t.cost;return t}
function tbox(){var t=tot();return '<div class="tb"><div><span>عدد الأصناف</span><b class="num">'+t.cnt+'</b></div><div><span>إجمالي الكمية</span><b class="num">'+f(t.q)+'</b></div><div><span>إجمالي التكلفة</span><b class="num">'+f(t.cost)+'</b></div><div><span>إجمالي قيمة البيع</span><b class="num">'+f(t.sale)+'</b></div><div class="pf"><span>صافي الربح المتوقع (البيع − التكلفة)</span><b class="num">'+f(t.profit)+'</b></div></div>'}

function debts(){
 var h=note?'<div class="okbox" role="status">'+esc(note)+'</div>':"";
 h+='<div class="total"><span>مجموع الديون عند الناس</span><b class="num">'+f(tot().debt)+'</b></div>';
 h+='<div class="box"><b>إضافة زبون عليه دين</b><div style="margin-top:8px"><input id="dn" placeholder="اسم الزبون"></div><div class="row" style="margin-top:8px"><input id="di" placeholder="الصنف المأخوذ"><input id="da" type="number" inputmode="decimal" placeholder="المبلغ" style="max-width:110px"></div><button class="btn full" id="dadd" style="margin-top:8px">إضافة الزبون</button><div class="msg bad" id="m"></div></div>';
 if(!D.debts.length)h+='<p class="sm">ما في ديون مسجلة. أضف أول زبون من فوق.</p>';
 D.debts.slice().sort(function(a,b){return b.bal-a.bal}).forEach(function(c){
  h+='<div class="box"><div class="top"><b>'+esc(c.name)+'</b><span class="bal num">'+f(c.bal)+'</span></div><div class="log">';
  c.log.forEach(function(l){h+='<div class="lg '+l.k+'"><span class="num">'+dt(l.d)+'</span><span>'+(l.k==="p"?"سداد":esc(l.item||"دين"))+'</span><b class="num">'+(l.k==="p"?"−":"+")+f(l.a)+'</b></div>'});
  h+='</div><input id="i'+c.id+'" placeholder="الصنف المأخوذ (عند إضافة دين)" style="margin-bottom:8px"><div class="row"><input type="number" inputmode="decimal" placeholder="المبلغ" id="a'+c.id+'"><button class="btn red" data-add="'+c.id+'">دين</button><button class="btn grn" data-pay="'+c.id+'">سداد</button></div></div>'});
 view.innerHTML=h;
}
function items(){
 var low=D.items.filter(function(i){return i.qty<=i.min});
 var h=tbox();
 h+='<div class="box"><b>إضافة صنف</b><div style="margin:8px 0"><input id="in" placeholder="اسم الصنف"></div><div class="g2"><label>الكمية<input id="iq" type="number" inputmode="numeric"></label><label>أقل كمية (للتنبيه)<input id="im" type="number" inputmode="numeric"></label><label>سعر الشراء<input id="ic" type="number" inputmode="decimal"></label><label>سعر البيع<input id="ip" type="number" inputmode="decimal"></label></div><button class="btn full" id="iadd" style="margin-top:10px">إضافة الصنف</button><div class="msg bad" id="m"></div></div>';
 if(low.length)h+='<div class="box" style="border-color:var(--amber);background:var(--tint)"><b>ناقص ('+low.length+')</b><p class="sm" style="margin:4px 0 8px">'+esc(low.map(function(i){return i.name}).join("، "))+'</p><button class="btn alt" id="copy">نسخ قائمة الشراء</button><div class="msg" id="cm"></div></div>';
 if(!D.items.length)h+='<p class="sm">ما في أصناف. أضف الصنف مع سعر الشراء والبيع، والإجمالي والربح يحسبون لوحدهم.</p>';
 D.items.forEach(function(i){
  var isLow=i.qty<=i.min;
  h+='<div class="box"><div class="top"><b>'+esc(i.name)+(isLow?'<span class="badge">ناقص</span>':'')+'</b><button class="btn alt" data-rm="'+i.id+'" style="min-height:38px">حذف</button></div>';
  h+='<div class="g2"><label>الكمية<input type="number" inputmode="numeric" data-f="qty" data-i="'+i.id+'" value="'+i.qty+'"></label><label>أقل كمية<input type="number" inputmode="numeric" data-f="min" data-i="'+i.id+'" value="'+i.min+'"></label><label>سعر الشراء<input type="number" inputmode="decimal" data-f="cost" data-i="'+i.id+'" value="'+i.cost+'"></label><label>سعر البيع<input type="number" inputmode="decimal" data-f="price" data-i="'+i.id+'" value="'+i.price+'"></label></div>';
  h+='<div class="calc"><span>ربح الوحدة <b class="num">'+f(i.price-i.cost)+'</b></span><span>التكلفة <b class="num">'+f(i.qty*i.cost)+'</b></span><span>قيمة البيع <b class="num">'+f(i.qty*i.price)+'</b></span><span>الربح <b class="num">'+f(i.qty*(i.price-i.cost))+'</b></span></div></div>'});
 view.innerHTML=h;
}
function count(){
 var fr=D.freq,st;
 if(!D.last)st="لم تجرد بعد. ابدأ أول جرد اليوم.";
 else{var since=Math.floor((Date.now()-D.last)/864e5),left=fr-since;
  st=left>0?"آخر جرد قبل "+since+" يوم. الجرد القادم بعد "+left+" يوم.":"حان موعد الجرد. آخر جرد قبل "+since+" يوم."}
 var h=tbox()+'<div class="box"><label class="fl" for="fr">كل كم تجرد؟</label><select id="fr">';
 [[7,"كل أسبوع"],[30,"كل شهر"],[120,"كل 4 شهور"],[180,"كل 6 شهور"]].forEach(function(o){h+='<option value="'+o[0]+'"'+(o[0]===fr?" selected":"")+'>'+o[1]+'</option>'});
 h+='</select><p style="margin:10px 0 0;font-weight:700">'+st+'</p></div>';
 h+='<h2>جرد الأصناف</h2><p class="sm">اكتب الكمية الفعلية في الرف. الخانة الفاضية تعني بدون تغيير.</p>';
 if(!D.items.length)h+='<p class="sm">أضف أصنافاً أولاً من تبويب المخزن والأسعار.</p>';
 D.items.forEach(function(i){h+='<div class="box"><div class="top"><b>'+esc(i.name)+'</b><span class="sm">بالنظام: <span class="num">'+i.qty+'</span></span></div><input type="number" inputmode="numeric" placeholder="الكمية الفعلية" data-c="'+i.id+'"></div>'});
 if(D.items.length)h+='<button class="btn full" id="csave">حفظ الجرد</button>';
 if(note)h+='<div class="okbox" style="margin-top:10px" role="status">'+esc(note)+'</div>';
 h+='<h2>نسخة احتياطية</h2><div class="box"><p class="sm" style="margin-top:0">البيانات محفوظة في هذا الهاتف فقط. انسخها واحفظها في واتساب أو الملاحظات، وارجع استعدها لو غيّرت الهاتف.</p><button class="btn alt" id="bk">نسخ البيانات</button><div class="msg" id="bm"></div><textarea id="rs" placeholder="الصق البيانات هنا لاسترجاعها"></textarea><button class="btn alt" id="rb" style="margin-top:8px">استرجاع</button></div>';
 view.innerHTML=h;
}
function render(){
 Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.setAttribute("aria-pressed",b.dataset.t===tab)});
 var s=document.getElementById("snd");s.textContent=D.snd?"الصوت: يعمل":"الصوت: مغلق";s.setAttribute("aria-pressed",D.snd);
 if(tab==="debts")debts();else if(tab==="items")items();else count();
}
function msg(t){var m=document.getElementById("m");if(m)m.textContent=t}
function copy(t,el,ok){var e=document.getElementById(el),bad="ما قدرنا ننسخ. حدد النص ونسخه يدوياً.";
 try{navigator.clipboard.writeText(t).then(function(){e.textContent=ok},function(){e.textContent=bad})}catch(x){e.textContent=bad}}

document.getElementById("snd").addEventListener("click",function(){D.snd=!D.snd;save();render();SND.add()});
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;tab=b.dataset.t;note="";render()});
view.addEventListener("change",function(e){
 var t=e.target;
 if(t.id==="fr"){D.freq=+t.value;save();return render()}
 if(t.dataset.f){var i=find(D.items,t.dataset.i),k=t.dataset.f,v=parseFloat(t.value);if(isNaN(v)||v<0)v=0;
  i[k]=(k==="qty"||k==="min")?Math.floor(v):n(v);save();render()}
});
view.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;
 if(t.id==="dadd"){
  var nm=document.getElementById("dn").value.trim(),it=document.getElementById("di").value.trim(),am=n(document.getElementById("da").value);
  if(nm.length<2)return msg("اكتب اسم الزبون.");
  if(am<=0)return msg("اكتب مبلغ الدين بأرقام أكبر من صفر.");
  var ex=D.debts.filter(function(c){return c.name===nm})[0];
  if(!ex){ex={id:id(),name:nm,bal:0,log:[]};D.debts.push(ex);SND.add()}else SND.debt();
  ex.bal=n(ex.bal+am);ex.log.push({k:"d",d:Date.now(),item:it,a:am});note="";save();return render()}
 if(t.dataset.add){
  var c=find(D.debts,t.dataset.add),v=n(document.getElementById("a"+c.id).value);
  if(v<=0){document.getElementById("a"+c.id).focus();return}
  c.bal=n(c.bal+v);c.log.push({k:"d",d:Date.now(),item:document.getElementById("i"+c.id).value.trim(),a:v});note="";SND.debt();save();return render()}
 if(t.dataset.pay){
  var p=find(D.debts,t.dataset.pay),pv=n(document.getElementById("a"+p.id).value);
  if(pv<=0){document.getElementById("a"+p.id).focus();return}
  SND.pay();
  if(pv>=p.bal){D.debts=D.debts.filter(function(x){return x.id!==p.id});note="تم تسديد دين "+p.name+" بالكامل وحُذف سجله.";setTimeout(SND.done,100)}
  else{p.bal=n(p.bal-pv);p.log.push({k:"p",d:Date.now(),a:pv});note="تم تسجيل سداد "+f(pv)+" من "+p.name+". المتبقي "+f(p.bal)+"."}
  save();return render()}
 if(t.id==="iadd"){
  var nm2=document.getElementById("in").value.trim(),q=parseInt(document.getElementById("iq").value,10),mn=parseInt(document.getElementById("im").value,10),cs=n(document.getElementById("ic").value),pr=n(document.getElementById("ip").value);
  if(nm2.length<2)return msg("اكتب اسم الصنف.");
  if(isNaN(q)||q<0)return msg("اكتب الكمية الحالية (صفر أو أكثر).");
  if(pr<=0)return msg("اكتب سعر البيع.");
  D.items.push({id:id(),name:nm2,qty:q,min:isNaN(mn)||mn<0?0:mn,cost:cs,price:pr});SND.add();save();return render()}
 if(t.dataset.rm){D.items=D.items.filter(function(i){return String(i.id)!==t.dataset.rm});save();return render()}
 if(t.id==="copy")return copy("قائمة الشراء:\n"+D.items.filter(function(i){return i.qty<=i.min}).map(function(i){return "- "+i.name}).join("\n"),"cm","تم النسخ. الصقها في واتساب.");
 if(t.id==="csave"){
  var ch=[],any=false,dv=0;
  Array.prototype.forEach.call(document.querySelectorAll("[data-c]"),function(inp){
   if(inp.value==="")return;var v=parseInt(inp.value,10);if(isNaN(v)||v<0)return;
   var i=find(D.items,inp.dataset.c),d=v-i.qty;any=true;
   if(d!==0){ch.push(i.name+": "+(d>0?"+":"")+d);dv+=d*i.cost}i.qty=v});
  if(!any){note="اكتب كمية فعلية لصنف واحد على الأقل.";return render()}
  D.last=Date.now();save();SND.add();
  note=ch.length?"تم الجرد. الفروقات: "+ch.join("، ")+". قيمة الفرق بالتكلفة: "+f(dv):"تم الجرد. ما في فروقات.";return render()}
 if(t.id==="bk")return copy("ABUSHUHAIRA:"+JSON.stringify(D),"bm","تم النسخ. احفظها في مكان آمن.");
 if(t.id==="rb"){
  var raw=document.getElementById("rs").value.trim().replace(/^ABUSHUHAIRA:/,"");
  try{var o=JSON.parse(raw);if(!Array.isArray(o.debts)||!Array.isArray(o.items))throw 0;D=Object.assign({debts:[],items:[],freq:30,last:null,snd:true},o);save();note="تم استرجاع البيانات.";render()}
  catch(x){document.getElementById("bm").textContent="البيانات غير صحيحة. انسخها كاملة من أول ABUSHUHAIRA."}}
});
load();render();
})();
</script>
</body>
</html>
